name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/scroll-animation-landing-69uxzl]
  workflow_dispatch:

# One in-flight deploy at a time; a newer push supersedes a queued one but never
# cancels a run that is already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Collect the site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r assets _site/
          # Pages runs Jekyll unless told not to, and Jekyll skips paths it
          # considers special. The site is plain static files.
          touch _site/.nojekyll
          echo "files: $(find _site -type f | wc -l)  size: $(du -sh _site | cut -f1)"

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
